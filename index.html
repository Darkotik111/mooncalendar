<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#3e0356">
    <title>MOON CALENDAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lugrasimo&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
 <style>
:root {
    color-scheme:dark;
}
body {
    background: #3e0356;
    color: #bcdcea;
    font-family:"Press Start 2P", system-ui;
    font-style: normal;
    text-align: center;
    padding: 20px;
}
.info-row {
    display: flex;
    align-items: center;         /* выравнивание по вертикали по центру */
    justify-content: center;      /* центрируем весь блок на странице */
    gap: 40px;                    /* отступ между колонками */
    margin: 30px auto;
    max-width: 900px;             /* чтобы на огромном экране не растягивалось */
    flex-wrap: wrap;              /* разрешаем перенос, когда места мало */
}

.info-col {
    flex: 1 1 400px;              /* растягивается, минимум 400px */
    text-align: left;             /* текст слева */
}

.info-col p {
    margin: 8px 0;                /* отступы между строками информации */
    line-height: 1.5;
}

.compass-col {
    flex: 0 0 280px;              /* компас фиксированной ширины */
}

/* Уменьшаем компас — он был 280px, теперь вписываем в колонку */
.compass {
    width: 240px;
    height: 240px;
    margin: 0;                    /* убираем авто-центрирование, оно теперь у родителя */
}

/* Буквы сторон света — тоже уменьшаем, чтобы влезли */
.dir-n { transform: translate(-50%, -50%) translateY(-95px); }
.dir-e { transform: translate(-50%, -50%) translateX(95px); }
.dir-s { transform: translate(-50%, -50%) translateY(95px); }
.dir-w { transform: translate(-50%, -50%) translateX(-95px); }

/* Стрелка — короче, чтобы влезла */
.compass-arrow {
    height: 90px;
}
.compass {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 40px auto;
}

.compass-ring {
    position: absolute;
    inset: 0;                      /* top/right/bottom/left: 0 */
    border: 2px solid #f4e4a8;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(244, 228, 168, 0.4);
    color: #f4e4a8;
}

.dir {
    position: absolute;
    font-size: 22px;
    font-weight: bold;
    color: #f4e4a8;
    left: 50%;
    top: 50%;
    transform-origin: 0 0;
}

.dir-n { transform: translate(-50%, -50%) translateY(-110px); }
.dir-e { transform: translate(-50%, -50%) translateX(110px); }
.dir-s { transform: translate(-50%, -50%) translateY(110px); }
.dir-w { transform: translate(-50%, -50%) translateX(-110px); }

.compass-arrow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 110px;
    background: linear-gradient(to bottom, #ff5e5e, transparent);
    transform-origin: bottom center;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 0.4s ease;
    border-radius: 2px;
}

.compass-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    background: #f4e4a8;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
}

.moon-typing {
font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #b0c2c1;
    text-align: center;
    margin: 20px 0 0;
    font-weight: normal;
}
.cursor {
    display: inline-block;
    margin-left: 2px;
    animation: blink 0.7s step-end infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
}

#now-time {
font-family: 'Press Start 2P', italic;
    font-size: 20px;
    color: #f6d1ec;
}
#phaseName {
    font-family: 'Press Start 2P', italic;
    font-size: 30px;
    color: #df14a6;
}
#enable-sensor {
    font-family: "Press Start 2P", system-ui;
    font-size: 12px;
    color: #f4e4a8;
    background: transparent;
    border: 2px solid #f4e4a8;
    padding: 12px 20px;
    margin: 0 0 16px;
    cursor: pointer;
    border-radius: 0;              /* пиксельная кнопка — прямые углы */
    box-shadow: 0 0 15px rgba(244, 228, 168, 0.4);
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
}

#enable-sensor:hover {
    background: #f4e4a8;
    color: #3e0356;
    box-shadow: 0 0 25px rgba(244, 228, 168, 0.8);
}

#enable-sensor:active {
    transform: translateY(2px);   /* «нажимается» вниз */
    box-shadow: 0 0 10px rgba(244, 228, 168, 0.6);
}
.moon-glow {
    width: 400px;
    height: 400px;
    margin: 30px auto;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(200, 169, 211, 0.8);
    user-select: none;
    
}

.moon {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
}

.moon-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  
}

.moon-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #12121e;
    border-radius: 50%;
    transition: transform 0.4s;
    
}
.dots span {
    opacity: 0;
    animation: dotBlink 1.2s infinite;
}

.dots span:nth-child(1) { animation-delay: 0s; }
.dots span:nth-child(2) { animation-delay: 0.4s; }
.dots span:nth-child(3) { animation-delay: 0.8s; }

@keyframes dotBlink {
    0%, 20%   { opacity: 0; }
    40%, 80%  { opacity: 1; }
    100%      { opacity: 0; }
}
.moon-message {
font-family:"Press Start 2P", system-ui;
font-style:italic;
color:rgba(241, 124, 184, 0.479) ;
padding: 30px;
font-size: 17px;}

@media (max-width: 700px) {
    .info-row {
        flex-direction: column;   /* ставим колонки друг над другом */
        gap: 20px;
    }

    .info-col {
        text-align: center;       /* на телефоне текст по центру */
    }

    .compass-col {
        flex: none;
    }
}
</style>
</head>
<body>
    <h1>Лунный календарь</h1>

    <h2 id="moon-message"></h2>
   <div class="info-row">

    <div class="info-col">
        <p id="today"></p>
        <p id="now-time"></p>
        <p id="moon-age"></p>
        <p id="moon-illum"></p>
        <p id="location"></p>
        <p id="moon-position"></p>
    </div>

    <div class="compass-col">
        <button id="enable-sensor">Включить компас</button>
        <div class="compass">
            <div class="compass-ring">
                <span class="dir dir-n">С</span>
                <span class="dir dir-e">В</span>
                <span class="dir dir-s">Ю</span>
                <span class="dir dir-w">З</span>
            </div>
            <div class="compass-arrow" id="compass-arrow"></div>
            <div class="compass-center"></div>
        </div>
    </div>

</div>

   <div class="moon-glow">
    <div class="moon">
        <img src="moon.png" class="moon-img" alt="Луна">
        <div class="moon-shadow" id="moon-shadow"></div>
    </div>
</div>

   
<script>
    // === Общие переменные ===
    let lastPhrase = '';
    let currentPhaseName = '';   // будем хранить текущую фазу

    const phaseMessages = {
        'Новолуние': 'Время начинать с чистого листа.',
        'Молодая Луна': 'Маленькие шаги дают большой результат.',
        'Первая четверть': 'Пора действовать, не откладывай.',
        'Растущая Луна': 'Всё складывается в твою пользу.',
        'Полнолуние': 'День ярких эмоций и ясных решений.',
        'Убывающая Луна': 'Отпусти лишнее, освободи место.',
        'Последняя четверть': 'Подведи итоги, разберись в себе.',
        'Старая Луна': 'Отдохни перед новым циклом.'
    };

    // === Функция печати "moon is typing" и замены на фразу ===
    function updateMessage(phrase) {
        if (phrase === lastPhrase) return;
        lastPhrase = phrase;

        const el = document.getElementById('moon-message');

        el.innerHTML =
            'moon is typing<span class="dots">' +
            '<span>.</span><span>.</span><span>.</span>' +
            '</span>';

        setTimeout(() => {
            el.style.transition = 'opacity 0.6s';
            el.style.opacity = '0';

            setTimeout(() => {
                el.textContent = phrase;
                el.style.opacity = '1';
            }, 600);
        }, 3000);
    }

    // === Основная функция: дата, время, Луна ===
    function updateMoon() {
        const now = new Date();

        const dateOptions = {
            day: 'numeric', month: 'long',
            year: 'numeric', weekday: 'short'
        };
        const timeOptions = {
            hour: 'numeric', minute: 'numeric', seconds: 'numeric'
        };

        document.getElementById('today').textContent =
            now.toLocaleDateString('ru-RU', dateOptions);
        document.getElementById('now-time').textContent =
            now.toLocaleTimeString('ru-RU', timeOptions);

        // Возраст Луны
        const knownNewMoon = new Date('2000-01-06T18:14:00Z');
        const synodicMonth = 29.530588853;
        const daysSince = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
        const moonAge = daysSince % synodicMonth;

        // Определяем фазу
        let phaseName;
        if (moonAge < 1.85)       phaseName = 'Новолуние';
        else if (moonAge < 5.54)  phaseName = 'Молодая Луна';
        else if (moonAge < 9.23)  phaseName = 'Первая четверть';
        else if (moonAge < 12.92) phaseName = 'Растущая Луна';
        else if (moonAge < 16.61) phaseName = 'Полнолуние';
        else if (moonAge < 20.30) phaseName = 'Убывающая Луна';
        else if (moonAge < 23.99) phaseName = 'Последняя четверть';
        else if (moonAge < 27.68) phaseName = 'Старая Луна';
        else                      phaseName = 'Новолуние';

        // Освещённость и тень на Луне
        const shadow = document.getElementById('moon-shadow');
        const cycle = moonAge / synodicMonth;
        const illuminated = (1 - Math.cos(cycle * 2 * Math.PI)) / 2;
        const direction = cycle < 0.5 ? -1 : 1;
        const offset = illuminated * direction * 100;
        const illumPercent = (illuminated * 100).toFixed(0);

        document.getElementById('moon-illum').textContent =
            'Освещённость: ' + illumPercent + '%';
        shadow.style.transform = `translateX(${offset}%)`;
        document.getElementById('moon-age').textContent =
            'Возраст Луны: ' + moonAge.toFixed(1) + ' дней ' + phaseName;

        // Если фаза изменилась — обновляем сообщение
        if (phaseName !== currentPhaseName) {
            currentPhaseName = phaseName;
            updateMessage(phaseMessages[phaseName] || 'Хорошего дня!');
        }
    }

    // === Запуск ===
    updateMoon();                         // первый запуск
    setInterval(updateMoon, 1000);        // обновляем каждую секунду
</script>
<script>
    const locationEl = document.getElementById('location');

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                locationEl.textContent =
                    'Координаты: ' + lat.toFixed(2) + '°, ' + lon.toFixed(2) + '°';

                const now = new Date();
                const moon = SunCalc.getMoonPosition(now, lat, lon);

                // Азимут от SunCalc идёт от юга, переводим в «от севера»
                let azimuthDeg = moon.azimuth * 180 / Math.PI + 180;
                azimuthDeg = (azimuthDeg + 360) % 360;

                const altitudeDeg = moon.altitude * 180 / Math.PI;

                const directions = [
                    'север', 'северо-восток', 'восток', 'юго-восток',
                    'юг', 'юго-запад', 'запад', 'северо-запад'
                ];
                const dirIndex = Math.round(azimuthDeg / 45) % 8;
                const direction = directions[dirIndex];
                
                const moonPositionEl = document.getElementById('moon-position');
                 window.moonAzimuth = azimuthDeg;
                const arrow = document.getElementById('compass-arrow');

                if (altitudeDeg < 0) {
                    // Луна под горизонтом
                    moonPositionEl.textContent =
                        'Луна под горизонтом, не видно (' + direction +
                        ', азимут ' + azimuthDeg.toFixed(0) + '°, высота ' +
                        altitudeDeg.toFixed(0) + '°)';
                    arrow.style.opacity = '0.3';   // приглушаем стрелку
                } else {
                    // Луна над горизонтом
                    moonPositionEl.textContent =
                        'Луна: ' + direction + ', азимут ' +
                        azimuthDeg.toFixed(0) + '°, высота ' +
                        altitudeDeg.toFixed(0) + '°';
                    arrow.style.opacity = '1';
                }
                       },
            (error) => {
                locationEl.textContent = 'Не удалось получить координаты';
                console.log('Ошибка геолокации:', error.message);
            }
        );
    } else {
        locationEl.textContent = 'Геолокация не поддерживается';
    }
</script>

<script>
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {

        btn.addEventListener('click', async () => {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission === 'granted') {
                startCompass();
                btn.style.display = 'none';
            } else {
                alert('Разрешение не выдано');
            }
        });
    } else {
        // На Android и других — запускаем сразу
        startCompass();
        btn.style.display = 'none';
    }
</script>
</body>
</html>
