<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MOON CALENDAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lugrasimo&family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
    <h1>Лунный календарь</h1>
    <h2 class="moon-typing">
    moon is typing<span class="cursor">|</span>
</h2>
    <p id="moon-message" class="moon-message"></p>
    <p id="today"></p>
    <p id="now-time"></p>
    <p id="moon-age"></p>
    <p id="moon-illum"></p>

    <div class="message-wrap">
    <p id="moon-message"></p>
</div>

   <div class="moon-glow">
    <div class="moon">
        <img src="moon.png" class="moon-img" alt="Луна">
        <div class="moon-shadow" id="moon-shadow"></div>
    </div>
</div>

    <style>

body {
    background: #3e0356;
    color: #bcdcea;
    font-family:"Press Start 2P", system-ui;
    font-style: normal;
    text-align: center;
    padding: 20px;
}

.moon-typing {
font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: #b0c2c1;
    text-align: center;
    margin: 20px 0 0;
    font-weight: normal;
}
.cursor {
    display: inline-block;
    margin-left: 2px;
    animation: blink 0.7s step-end infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
}
#moon-message {
    font-family: 'Press Start 2P', italic;
    font-size: 20px;
    color: #eb83cf;
    text-align: center;
    min-height: 30px;   /* чтобы место не «прыгало» до появления текста */
    margin: 10px 0 30px;
}


.moon-glow {
    width: 400px;
    height: 400px;
    margin: 30px auto;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(200, 169, 211, 0.8);
    user-select: none;
    
}

.moon {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
}

.moon-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  
}

.moon-shadow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #12121e;
    border-radius: 50%;
    transition: transform 0.4s;
    
}

.moon-message {
font-family:"Press Start 2P", system-ui;
font-style:italic;
color:rgba(241, 124, 184, 0.479) ;
padding: 30px;
font-size: 17px;}
</style>
<script>
const messageEl = document.getElementById('moon-message');

// Сначала пишем "moon is typing..." с мигающим курсором
let i = 0;
const interval = setInterval(() => {
    messageEl.textContent = messageText.slice(0, i + 1);
    i++;

    if (i >= messageText.length) {
        clearInterval(interval);
        // После "..." показываем саму фразу
        setTimeout(() => {
            messageEl.textContent = 'moon-message';
        }, 1500);
    }
}, 100);
</script>

<script>
function updateMoon() {
    
        const now = new Date();

        const dateOptions = {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            weekday: 'short'
        };

        const timeOptions = {
            hour: 'numeric',
            minute: 'numeric',
            seconds: 'numeric'
        };
       document.getElementById('today').textContent = now.toLocaleDateString('ru-RU', dateOptions);
       
       document.getElementById('now-time').textContent = now.toLocaleTimeString('ru-RU', timeOptions);
   
  
    const todayDate = new Date();
    const knownNewMoon = new Date('2000-01-06T18:14:00Z');
    const synodicMonth = 29.530588853;
    const daysSince = (todayDate - knownNewMoon) / (1000 * 60 * 60 * 24);
    const moonAge = daysSince % synodicMonth;
let phaseName;

if (moonAge < 1.85) {
    phaseName = 'Новолуние';
} else if (moonAge < 5.54) {
    phaseName = 'Молодая Луна';
} else if (moonAge < 9.23) {
    phaseName = 'Первая четверть';
} else if (moonAge < 12.92) {
    phaseName = 'Растущая Луна';
} else if (moonAge < 16.61) {
    phaseName = 'Полнолуние';
} else if (moonAge < 20.30) {
    phaseName = 'Убывающая Луна';
} else if (moonAge < 23.99) {
    phaseName = 'Последняя четверть';
} else if (moonAge < 27.68) {
    phaseName = 'Старая Луна';
} else {
    phaseName = 'Новолуние';
}
const shadow = document.getElementById('moon-shadow');

const cycle = moonAge / synodicMonth;         
const illuminated = (1 - Math.cos(cycle * 2 * Math.PI)) / 2;  
const direction = cycle < 0.5 ? -1 : 1;       
const offset = illuminated * direction * 100;  
const illumPercent = (illuminated * 100).toFixed(0);
document.getElementById('moon-illum').textContent = 'Освещённость: ' + illumPercent + '%';
shadow.style.transform = `translateX(${offset}%)`;
    document.getElementById('moon-age').textContent = 'Возраст Луны: ' + moonAge.toFixed(1) + ' дней ' + phaseName;
 // Выбираем фразу по номеру дня (одна и та же весь день)
   const phaseMessages = {
    'Новолуние': 'Время начинать с чистого листа.',
    'Молодая Луна': 'Маленькие шаги дают большой результат.',
    'Первая четверть': 'Пора действовать, не откладывай.',
    'Растущая Луна': 'Всё складывается в твою пользу.',
    'Полнолуние': 'День ярких эмоций и ясных решений.',
    'Убывающая Луна': 'Отпусти лишнее, освободи место.',
    'Последняя четверть': 'Подведи итоги, разберись в себе.',
    'Старая Луна': 'Отдохни перед новым циклом.'
};

document.getElementById('moon-message').textContent =
    phaseMessages[phaseName] || 'Хорошего дня!';
}
updateMoon();
setInterval(updateMoon, 1000); </script>

</body>
</html>
